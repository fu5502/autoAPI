services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: autoapi
      POSTGRES_USER: autoapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - autoapi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapi -d autoapi"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - autoapi-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  autoapi:
    build: .
    ports:
      - "${AUTOAPI_BIND_ADDRESS:-0.0.0.0}:${AUTOAPI_PORT:-8080}:8080"
      - "${CHECKIN_VNC_BIND_ADDRESS:-127.0.0.1}:${CHECKIN_VNC_PORT:-6080}:6080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_MODE: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379
      TZ: ${TZ:-Asia/Shanghai}
      AUTOAPI_CHECKIN_DATA_DIR: /data/checkin
      CHECKIN_VNC_PASSWORD: ${CHECKIN_VNC_PASSWORD:?Set CHECKIN_VNC_PASSWORD in .env}
      CHECKIN_BROWSER_URL: ${CHECKIN_BROWSER_URL:-http://localhost:6080/vnc.html?autoconnect=true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - autoapi-checkin:/data/checkin

volumes:
  autoapi-postgres:
  autoapi-redis:
  autoapi-checkin:
